<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Dream High — pixel-lace poster + glass bubbles (refraction study)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#dfe5f6;overflow:hidden}
  section.s{position:relative;width:1920px;height:1080px;overflow:hidden}
  canvas{position:absolute;inset:0;width:1920px;height:1080px}
</style>
</head>
<body>
<section class="s" id="s1"><canvas id="c" width="1920" height="1080"></canvas></section>
<script src="three.bundle.js"></script>
<script src="ref-assets.js"></script>
<script>
/*
  参考图运用 (references/README.md)
  01 配色与整体风格:淡蓝→白纵向渐变、上半白色像素卷草压在图上、下半图从白底里透出卷草(反相)、
     点阵蕾丝、金色小星/蓝色十字闪点、胶片颗粒+半调网点。全部程序化重做,不是贴图。
  04 舞者  → 蓝白双色调,作为上半的"图",黑底变透明
  05 骨骼  → 蓝灰双色调,作为下半透出卷草的"图"
  03 气球/泡泡 → 3D:灰玫瑰缎面气球 + 近乎透明的肥皂泡,折射上面这张海报
*/
(async()=>{
const {THREE,RoomEnvironment,EffectComposer,RenderPass,UnrealBloomPass,ShaderPass,OutputPass}=window.__gl;
const W=1920,H=1080;
const q=new URLSearchParams(location.search);
const fixed=q.has('t')?+q.get('t'):null;

try{ await Promise.all([document.fonts.load('italic 300 200px "Cormorant Garamond"'),document.fonts.load('300 40px "Noto Serif SC"','少女时期的英雄主义')]); }catch(e){}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
const [dancer,bone]=await Promise.all([loadImg(window.__ref.dancer),loadImg(window.__ref.bone)]);

// ---------- helpers
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=rng(20261111);
const hash=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;};
const sm=t=>t*t*(3-2*t);
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
  return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;}
const fbm=(x,y)=>{let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vnoise(x*f,y*f);a*=.5;f*=2.03;}return s;};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

// ---------- 2D poster (all in 1920x1080 space, drawn at 2x)
function poster(){
  const S=2,cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;const g=cv.getContext('2d');
  g.scale(S,S);g.imageSmoothingQuality='high';

  // 1. cloudy periwinkle sky (01): blue with violet patches and pale clouds
  {const w=320,h=180,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
   const im=x.createImageData(w,h);
   const deep=hex('#7186cf'),mid=hex('#97a9e0'),pale=hex('#c9d3f1'),vio=hex('#9a8fd4');
   for(let j=0;j<h;j++)for(let i=0;i<w;i++){
     const n=fbm(i/60,j/60), n2=fbm(i/45+9,j/45+4), n3=fbm(i/18+3,j/18+7);
     let col=mix3(deep,mid,clamp(n*1.25+j/h*.1));
     col=mix3(col,pale,clamp((n2-.42)*2.6)*.8);
     col=mix3(col,vio,clamp((n-.5)*2.2)*.35);
     col=mix3(col,deep,clamp((n3-.55)*3)*.25);
     const k=(j*w+i)*4;im.data[k]=col[0];im.data[k+1]=col[1];im.data[k+2]=col[2];im.data[k+3]=255;}
   x.putImageData(im,0,0);g.drawImage(c,0,0,W,H);}

  // 2. dancer (04): blue→white duotone, black ground becomes transparent, soft-focus
  {const dw=dancer.width,dh=dancer.height,c=document.createElement('canvas');c.width=dw;c.height=dh;const x=c.getContext('2d');
   x.drawImage(dancer,0,0);const im=x.getImageData(0,0,dw,dh),d=im.data;
   const dark=hex('#4d61b2'),tint=hex('#aebbea');
   // figure mask = heavily blurred luminance, so shadows inside the body stay opaque (blue) instead of vanishing
   let A=new Float32Array(dw*dh);
   for(let k=0;k<A.length;k++){const l=(.299*d[k*4]+.587*d[k*4+1]+.114*d[k*4+2])/255;A[k]=sm(clamp((l-.05)/.25));}
   const box=(src,rad)=>{const o=new Float32Array(src.length),t=new Float32Array(src.length),n=2*rad+1;
     for(let j=0;j<dh;j++){let s0=0;for(let i=-rad;i<=rad;i++)s0+=src[j*dw+clamp(i,0,dw-1)];
       for(let i=0;i<dw;i++){t[j*dw+i]=s0/n;s0+=src[j*dw+Math.min(dw-1,i+rad+1)]-src[j*dw+Math.max(0,i-rad)];}}
     for(let i=0;i<dw;i++){let s0=0;for(let j=-rad;j<=rad;j++)s0+=t[clamp(j,0,dh-1)*dw+i];
       for(let j=0;j<dh;j++){o[j*dw+i]=s0/n;s0+=t[Math.min(dh-1,j+rad+1)*dw+i]-t[Math.max(0,j-rad)*dw+i];}}
     return o;};
   A=box(box(A,9),9);
   for(let j=0;j<dh;j++)for(let i=0;i<dw;i++){
     const k=(j*dw+i)*4,r=d[k],gg=d[k+1],b=d[k+2],l=(.299*r+.587*gg+.114*b)/255;
     const ll=Math.pow(l,.8);
     let col=ll<.5?mix3(dark,tint,ll*2):mix3(tint,[255,255,255],(ll-.5)*2);
     col=[col[0]+(r-gg)*.14,col[1]-(r-gg)*.04,col[2]+(r-gg)*.04];
     const e=Math.min(i,dw-1-i)/70, t=j/70;
     const a=sm(clamp((A[j*dw+i]-.10)/.25))*sm(clamp(e))*sm(clamp(t));
     d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=a*255;}
   x.putImageData(im,0,0);
   const sc=H/dh*1.04,dW=dw*sc;
   g.save();g.filter='blur(1.3px)';g.drawImage(c,1010,-24,dW,dh*sc);g.restore();
   // soft white glow around the figure
   g.save();g.globalCompositeOperation='screen';g.filter='blur(30px)';g.globalAlpha=.28;g.drawImage(c,1010,-24,dW,dh*sc);g.restore();}

  // 3. fade to white paper (01: lower half is white)
  {const f=g.createLinearGradient(0,560,0,880);
   f.addColorStop(0,'rgba(251,252,255,0)');f.addColorStop(.6,'rgba(251,252,255,.88)');f.addColorStop(1,'rgba(251,252,255,1)');
   g.fillStyle=f;g.fillRect(0,560,W,H-560);}

  // pixel-scroll mask grid
  const C=14,GW=Math.ceil(W/C),GH=Math.ceil(H/C);
  const cell=new Uint8Array(GW*GH),hole=new Uint8Array(GW*GH);
  const mark=(arr,px,py,rc)=>{const cx=px/C,cy=py/C,r=Math.ceil(rc);
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const X=Math.floor(cx)+i,Y=Math.floor(cy)+j;
      if(X<0||Y<0||X>=GW||Y>=GH)continue;const dx=X+.5-cx,dy=Y+.5-cy;if(dx*dx+dy*dy<=rc*rc)arr[Y*GW+X]=1;}};
  const spiral=(cx,cy,Rr,dir,a0,turns=1.65,rEnd=7)=>{const pts=[],Th=turns*Math.PI*2;
    for(let th=0;th<=Th;th+=.02){const t=th/Th,r=rEnd+(Rr-rEnd)*Math.pow(1-t,.9),a=a0+dir*th;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return pts;};
  const bez=(p0,p1,p2,p3)=>{const o=[];for(let t=0;t<=1;t+=.005){const u=1-t;o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return o;};
  const paths=[]; // for dot-lace reuse
  function pair(A,B,rc,tailL){
    const dAB=Math.atan2(B[1]-A[1],B[0]-A[0]);
    const a0=(s,dir,ang)=>Math.atan2(dir*Math.cos(ang)*s,-dir*Math.sin(ang)*s);
    const aA=a0(1,A[3],dAB), aB=a0(1,B[3],dAB+Math.PI);
    const sA=spiral(A[0],A[1],A[2],A[3],aA), sB=spiral(B[0],B[1],B[2],B[3],aB);
    const tb=(dir,a)=>[dir*Math.sin(a),-dir*Math.cos(a)];
    const tA=tb(A[3],aA),tB=tb(B[3],aB),P0=sA[0],P3=sB[0];
    const tail=bez(P0,[P0[0]+tA[0]*tailL,P0[1]+tA[1]*tailL],[P3[0]+tB[0]*tailL,P3[1]+tB[1]*tailL],P3);
    [sA,sB].forEach(p=>{p.forEach(([x,y])=>mark(cell,x,y,rc));paths.push(p);});
    tail.forEach(([x,y])=>mark(cell,x,y,rc*.82));paths.push(tail);
  }
  // [cx,cy,R,dir]
  pair([1580,150,125,1],[1180,250,110,-1],1.2,220);
  pair([1760,760,115,-1],[1330,850,135,1],1.2,260);
  pair([1010,960,95,1],[1560,1000,100,-1],1.2,240);
  // flower blobs
  const blob=(cx,cy,n,rr)=>{for(let i=0;i<n;i++){const a=R()*6.28,d=R()*rr*.8;mark(cell,cx+Math.cos(a)*d*C,cy+Math.sin(a)*d*C,rr*(.55+R()*.5));}
    for(let i=0;i<2;i++){const a=R()*6.28,d=R()*rr*.5;mark(hole,cx+Math.cos(a)*d*C,cy+Math.sin(a)*d*C,1.1);}};
  blob(980,120,6,3.4);blob(1840,330,5,3);blob(900,700,6,3.4);blob(1000,420,4,2.4);
  for(let i=0;i<cell.length;i++)if(hole[i])cell[i]=0;
  // stray cells (broken edge)
  for(let j=1;j<GH-1;j++)for(let i=1;i<GW-1;i++){const k=j*GW+i;
    if(cell[k]&&R()<.05&&(!cell[k-1]||!cell[k+1]||!cell[k-GW]||!cell[k+GW]))cell[k]=0;}

  // 4. dot lace (01): fine dotted double-outline spirals at the left, behind the type
  {const lace=[[330,860,250,1],[150,520,170,-1],[640,1010,190,-1],[220,150,180,1],[860,40,120,1]];
   const dots=(pts,off,rad)=>{let acc=0,px=null;pts.forEach(([x,y],i)=>{if(i===0){px=[x,y];return;}
      acc+=Math.hypot(x-px[0],y-px[1]);px=[x,y];if(acc<7.5)return;acc=0;
      const al=y<560?.8:.85, c=y<560?[255,255,255]:[150,165,215];
      g.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${al*(0.7+R()*.3)})`;g.beginPath();g.arc(x,y,rad,0,6.283);g.fill();});};
   lace.forEach(([cx,cy,Rr,dir])=>{const a=R()*6.28;
     dots(spiral(cx,cy,Rr,dir,a,1.9,10),0,1.5);dots(spiral(cx,cy,Rr-16,dir,a,1.8,10),0,1.2);});}

  // 5. bone (05) duotoned, available to the lower cells
  const boneC=document.createElement('canvas');boneC.width=W*S;boneC.height=H*S;
  {const bw=bone.width,bh=bone.height,c=document.createElement('canvas');c.width=bw;c.height=bh;const x=c.getContext('2d');
   x.drawImage(bone,0,0);const im=x.getImageData(0,0,bw,bh),d=im.data;
   const sh=hex('#5f74c0'),pk=hex('#e9b9cf');
   for(let k=0;k<d.length;k+=4){const l=(.299*d[k]+.587*d[k+1]+.114*d[k+2])/255;
     const t=clamp((l-.34)/.6);let col=mix3(sh,[255,255,255],Math.pow(t,1.15));
     col=mix3(col,pk,clamp(.5-t)*.35);d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];}
   x.putImageData(im,0,0);
   const bx=boneC.getContext('2d');bx.scale(S,S);bx.imageSmoothingQuality='high';
   const sc=1180/bw;bx.drawImage(c,720,330,bw*sc,bh*sc);}

  // 6. pixel-scroll cells: white pressed onto the photo above, photo (bone) showing through below
  g.imageSmoothingEnabled=false;
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    if(!cell[j*GW+i])continue;
    const x=i*C,y=j*C,yc=y+C/2;
    const pw=clamp((860-yc)/220);                 // 1 = white cells, 0 = photo cells
    const white=R()<pw;
    let a=R()<.16?.35+.4*R():1;
    if(white){g.globalAlpha=a*.97;g.fillStyle='#ffffff';g.fillRect(x,y,C,C);}
    else{g.globalAlpha=a;g.drawImage(boneC,x*S,y*S,C*S,C*S,x,y,C,C);}
  }
  g.globalAlpha=1;g.imageSmoothingEnabled=true;

  // 7. stars: gold 4-point (upper), blue cross sparkles (lower)
  const star=(x,y,r,col,gl)=>{g.save();g.shadowColor=gl;g.shadowBlur=r*1.2;g.fillStyle=col;g.beginPath();
    g.moveTo(x,y-r);g.quadraticCurveTo(x+r*.1,y-r*.1,x+r,y);g.quadraticCurveTo(x+r*.1,y+r*.1,x,y+r);
    g.quadraticCurveTo(x-r*.1,y+r*.1,x-r,y);g.quadraticCurveTo(x-r*.1,y-r*.1,x,y-r);g.fill();g.restore();};
  for(let i=0;i<46;i++){const x=R()*W,y=Math.pow(R(),1.4)*600;star(x,y,3+R()*R()*13,'rgba(226,200,140,.95)','rgba(255,240,200,.9)');}
  const cross=(x,y,s,col)=>{g.fillStyle=col;[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{g.beginPath();g.arc(x+dx*s,y+dy*s,s*.38,0,6.283);g.fill();});};
  for(let i=0;i<16;i++){cross(R()*W,640+R()*400,5+R()*4,'rgba(122,142,208,.8)');}
  for(let i=0;i<10;i++){cross(R()*W,R()*560,4+R()*3,'rgba(255,255,255,.75)');}

  // 8. halftone dot screen
  {const pc=document.createElement('canvas');pc.width=pc.height=5;const p=pc.getContext('2d');
   p.fillStyle='#fff';p.beginPath();p.arc(2.5,2.5,1.1,0,6.283);p.fill();
   g.save();g.globalAlpha=.16;g.fillStyle=g.createPattern(pc,'repeat');g.fillRect(0,0,W,620);g.restore();
   const pd=document.createElement('canvas');pd.width=pd.height=5;const q2=pd.getContext('2d');
   q2.fillStyle='#8294d0';q2.beginPath();q2.arc(2.5,2.5,.9,0,6.283);q2.fill();
   g.save();g.globalAlpha=.14;g.fillStyle=g.createPattern(pd,'repeat');g.fillRect(0,620,W,H-620);g.restore();}

  // 9. type
  g.textAlign='left';g.fillStyle='#2f3d93';
  g.shadowColor='rgba(255,255,255,.7)';g.shadowBlur=24;
  g.font='italic 300 176px "Cormorant Garamond","Noto Serif SC",serif';
  g.fillText('Dream big.',112,470);
  g.fillText('Dream high.',112,640);
  g.shadowBlur=0;
  g.font='300 26px "Noto Serif SC",serif';g.fillStyle='#4a58a6';
  if(g.letterSpacing!==undefined)g.letterSpacing='26px';
  g.fillText('少女时期的英雄主义',120,H-70);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}

// ---------- WebGL
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.NoToneMapping;

const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=.85;
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,50);cam.position.set(0,0,9);

const bgH=2*Math.tan(THREE.MathUtils.degToRad(16))*(9+3);
const bg=new THREE.Mesh(new THREE.PlaneGeometry(bgH*W/H,bgH),new THREE.MeshBasicMaterial({map:poster(),toneMapped:false}));
bg.position.z=-3;scene.add(bg);

const U=5.16/1080, wx=px=>(px-960)*U, wy=py=>(540-py)*U;

// satin balloon (03): dusty rose, one clean highlight
const bal=new THREE.Group();
const balMat=new THREE.MeshPhysicalMaterial({color:'#d6aac0',roughness:.45,metalness:0,
  clearcoat:.5,clearcoatRoughness:.14,sheen:.4,sheenColor:new THREE.Color('#ffe0ea'),sheenRoughness:.55});
const balloon=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),balMat);balloon.scale.set(1,1.14,1);bal.add(balloon);
const kn=new THREE.Mesh(new THREE.ConeGeometry(.07,.16,24),balMat);kn.position.set(.03,-1.2,0);kn.rotation.z=Math.PI+.1;bal.add(kn);
const curve=new THREE.CatmullRomCurve3([[.04,-1.27,0],[.2,-1.75,.1],[.05,-2.3,0],[.3,-3.0,.1]].map(a=>new THREE.Vector3(...a)));
bal.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,.006,6),new THREE.MeshBasicMaterial({color:'#f3c5d6'})));
bal.scale.setScalar(.62);bal.position.set(wx(1665)*8.7/9,wy(210)*8.7/9,.3);scene.add(bal);
const hot=new THREE.PointLight(0xffffff,1.6,0,2);hot.position.set(bal.position.x-.5,bal.position.y+.5,2.4);scene.add(hot);

// soap bubbles (03): nearly clear, thin-film edge, pin highlights
const soap=()=>new THREE.MeshPhysicalMaterial({
  color:'#ffffff',metalness:0,roughness:0,transmission:1,thickness:.35,ior:1.12,dispersion:3,
  iridescence:1,iridescenceIOR:1.3,iridescenceThicknessMinimum:120,iridescenceThicknessMaximum:520,
  clearcoat:1,clearcoatRoughness:0,envMapIntensity:1.8,
  attenuationColor:new THREE.Color('#9db4f2'),attenuationDistance:3.2});
const bubbles=[];
// [px,py,z,r] — kept off the type block (x<900, 380<y<680)
const B=[
  [1190,830,1.4,.8],
  [1500,470,1.2,.3],[1810,600,1.8,.42],[700,930,1.2,.2],[1010,760,1.2,.17],
  [1880,200,1.0,.26],[1350,60,1.4,.3],[720,170,.5,.2],[1040,330,.2,.1],
  [60,330,1.2,.24],[560,90,.8,.12],[1450,700,1.4,.12],[1700,1010,1.6,.3],[90,820,.8,.16],[900,120,.6,.14],[1280,560,.8,.14]
];
B.forEach(([px,py,z,r],i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,96,64),soap());
  const pf=(9-z)/9;m.position.set(wx(px)*pf,wy(py)*pf,z);m.userData.b=[m.position.x,m.position.y,z,i];scene.add(m);bubbles.push(m);});

// post: bloom only on highlights >1, chromatic fringe, film grain
const comp=new EffectComposer(renderer);comp.setSize(W,H);
comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),0.3,0.8,1.0));
comp.addPass(new OutputPass());
comp.addPass(new ShaderPass({
  uniforms:{tDiffuse:{value:null},t:{value:0}},
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float t;varying vec2 v;
  float r(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec2 d=v-.5;float k=dot(d,d);
    vec3 c=vec3(texture2D(tDiffuse,v+d*k*.004).r,texture2D(tDiffuse,v).g,texture2D(tDiffuse,v-d*k*.004).b);
    c*=1.-k*.12;
    vec2 gp=floor(v*vec2(960.,540.));
    float gr=(r(gp+t)-.5)*.07+(r(v*1920.+t*1.7)-.5)*.03;
    c+=gr*(1.-.35*smoothstep(.75,1.,dot(c,vec3(.333))));
    gl_FragColor=vec4(c,1.);}`}));
const grain=comp.passes[comp.passes.length-1];

function frame(t){
  bal.position.y=wy(210)*8.7/9+Math.sin(t*.5)*.08;bal.rotation.z=Math.sin(t*.4)*.03;
  bubbles.forEach(m=>{const [x,y,z,i]=m.userData.b;m.position.set(x+Math.sin(t*.35+i)*.04,y+Math.sin(t*.6+i*1.7)*.07,z);});
  grain.uniforms.t.value=Math.floor(t*12)/12;
  comp.render();
}
if(fixed!==null){frame(fixed);document.body.dataset.ready=1;}
else{(function f(ms){frame(ms/1000);requestAnimationFrame(f)})(0);}
})();
</script>
</body>
</html>
