<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/poster-bw.css">
<style>
/* EFFECT: halftone — 纯 CSS 半调网点。外层 .fx-halftone 负责 contrast 二值化,
   内部图片先灰度+模糊,再叠一层点阵,点的大小由 --dot 控制。可导出静帧。 */
.fx-halftone{position:absolute;inset:0;background:#000;overflow:hidden;isolation:isolate;filter:brightness(.75) contrast(40)}
.fx-halftone img{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:grayscale(1) blur(var(--blur,4px))}
/* 原理:灰度图 + 径向点阵相加(plus-lighter),再整体阈值化。图越暗,黑点越大。--dot 点距,--blur 越大越平滑。 */
.fx-halftone::after{content:"";position:absolute;inset:-20%;mix-blend-mode:plus-lighter;
  background:radial-gradient(circle closest-side,#000,#fff) 0 0/var(--dot,22px) var(--dot,22px);transform:rotate(-15deg)}
</style>
</head>
<body>
<section class="s light" id="s1">
  <div class="fx-halftone" style="--dot:20px"><img src="../../decks/organic-forms/art/chrome.png"></div>
  <div class="abs mono" style="left:90px;top:80px">fx / halftone</div>
  <div class="abs anton" style="left:80px;bottom:80px;font-size:380px">HALFTONE</div>
</section>
<section class="s light" id="s2">
  <div class="fx-halftone" style="--dot:12px;--blur:3px"><img src="../../decks/organic-forms/art/foam_light.png"></div>
  <div class="abs mono" style="right:90px;top:80px;text-align:right">dot 12px — 点越小越接近照片</div>
</section>
</body></html>
