<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/poster-bw.css">
<style>
/* EFFECT: grain — 给任意元素加 class="fx-grain" 即可叠胶片颗粒。--grain 控制强度 */
.fx-grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--grain,.35);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 2.2 -.5'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
</style>
</head>
<body>
<section class="s dark fx-grain" id="s1" style="--grain:1">
  <img class="bleed" src="../../decks/organic-forms/art/foam_dark.png" style="filter:brightness(.8) contrast(1.15)">
  <div class="abs mono" style="left:90px;top:80px">fx / grain</div>
  <div class="abs anton" style="left:80px;bottom:90px;font-size:360px">GRAIN</div>
</section>
<section class="s light fx-grain" id="s2" style="--grain:.9">
  <div class="abs anton" style="left:80px;top:60px;font-size:520px">PAPER</div>
  <div class="abs mono" style="left:90px;bottom:80px">同一个 class,浅色底也能用 — 颗粒让纯色面有纸张质感</div>
</section>
</body></html>
