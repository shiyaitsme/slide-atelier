<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/poster-bw.css">
<style>
/* EFFECT: magic-move — 相邻页的同一元素翻页时平滑变形。
   两页里给元素加相同的 data-morph="名字",用 templates/presenter 打开 ?present 后翻页即生效。
   原理是 FLIP:记下旧位置,换页后用 Web Animations 从旧矩形动画到新矩形。不带 ?present 时是三页静态稿,可正常截图/出 PPTX。 */
</style>
</head>
<body>
<section class="s dark" id="s1">
  <img class="abs" data-morph="hero" src="../../decks/organic-forms/art/chrome.png" style="right:60px;top:-40px;width:1100px;height:1100px;object-fit:cover">
  <div class="abs anton" data-morph="title" style="left:80px;bottom:90px;font-size:300px">MOVE</div>
  <div class="abs mono" style="left:90px;top:80px">fx / magic-move — 按 → 翻页</div>
</section>
<section class="s light" id="s2">
  <img class="abs" data-morph="hero" src="../../decks/organic-forms/art/chrome.png" style="left:90px;top:200px;width:620px;height:620px;object-fit:cover">
  <div class="abs anton" data-morph="title" style="left:780px;top:200px;font-size:140px">MOVE</div>
  <div class="abs" style="left:790px;top:420px;width:900px;font-size:44px;font-weight:300;line-height:1.7">同一张图、同一个词,在相邻两页里换了位置和大小。翻页时它们不是切换,而是移动过去。</div>
</section>
<section class="s dark" id="s3">
  <img class="abs" data-morph="hero" src="../../decks/organic-forms/art/chrome.png" style="left:0;top:-420px;width:1920px;height:1920px;object-fit:cover;filter:brightness(.6)">
  <div class="abs anton" data-morph="title" style="left:80px;bottom:90px;font-size:520px">MOVE</div>
</section>
<script src="../../templates/presenter/presenter.js"></script>
</body></html>
