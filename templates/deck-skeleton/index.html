<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;500;900&display=swap" rel="stylesheet">
<!-- 换风格:改这一行指向别的 styles/*.css -->
<link rel="stylesheet" href="../../styles/poster-bw.css">
</head>
<body>

<!-- 1 封面 -->
<section class="s dark" id="s1">
  <div class="abs mono" style="left:90px;top:80px">TITLE — 2026</div>
  <div class="abs anton" style="left:80px;bottom:90px;font-size:360px">TITLE</div>
</section>

<!-- 2 章节过渡 -->
<section class="s light" id="s2">
  <div class="abs mono" style="left:90px;top:80px">01</div>
  <div class="abs anton" style="left:80px;top:300px;font-size:480px">CHAPTER</div>
</section>

<!-- 3 内容页:一页只讲一件事,标题写结论句 -->
<section class="s light" id="s3">
  <div class="abs mono" style="left:90px;top:80px">02 — Topic</div>
  <div class="abs" style="left:90px;top:200px;width:1100px;font-size:96px;font-weight:900;line-height:1.2">标题写成一句结论</div>
  <div class="abs" style="left:90px;top:640px;width:760px;font-size:28px;font-weight:300;line-height:1.8">正文最多三行。</div>
</section>

<!-- 4 引言页 -->
<section class="s dark" id="s4">
  <div class="abs" style="left:160px;top:300px;width:1500px;font-size:110px;font-weight:300;line-height:1.35">一句话引言。</div>
  <div class="abs mono" style="left:160px;bottom:100px">— Source</div>
</section>

<!-- 5 结尾 -->
<section class="s dark" id="s5">
  <div class="abs anton" style="left:80px;top:360px;font-size:300px">THANK YOU</div>
</section>

<script src="../presenter/presenter.js"></script>
</body></html>
